# prefixキーをC-fに変更する
set -g prefix C-f

# C-bのキーバインドを解除する
unbind C-b

# List of plugin. Managed by https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'

# settings for tmux-prefix-highlight
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'cyan'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow'
set -g @prefix_highlight_sync_prompt 'Sync'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green'

# settings for tmux-weather
set-option -g @tmux-weather-location "Tokyo"
set-option -g @tmux-weather-format "%l:+%c+%t"
set-option -g @tmux-weather-units "m"

# キーストロークのディレイを減らす
set -sg escape-time 1

# window / paneのインデックスを0から
set -g base-index 0
set -g pane-base-index 0

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-f*2でtmux内のプログラムにC-fを送る
bind C-f send-prefix

# | でペインを縦に分割する
bind | split-window -h
bind \\ split-window -h
bind - split-window -v

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# For displaying true color
# https://jdhao.github.io/2018/10/19/tmux_nvim_true_color/
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


# ステータスバーの色を設定する
set -g status-style fg=white,bg=black

# ウィンドウリストの色を設定する
setw -g window-status-style fg=cyan,bg=default,dim
# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg=white,bg=red,bright

# ペインボーダーの色を設定する
set -g pane-border-style fg=green,bg=default
# アクティブなペインを目立たせる
set -g pane-active-border-style fg=yellow,bg=default

# コマンドラインの色を設定する
set -g message-style fg=white,bg=black,bright

# visual notification
setw -g monitor-activity on
set -g visual-activity on

# Status Bar
set -g status-left-length 100
# https://github.com/tmux-plugins/tmux-prefix-highlight
set -g status-left " #[fg=green]Session: #S #[fg=yellow]Window #I #[fg=cyan]Pane: #P  #{prefix_highlight}"

set-option -g status-right-length 120
set-option -g status-right-style default
set-option -g status-right "#[fg=green,bg=default,bright]CPU #{cpu_percentage} RAM #{ram_percentage} "
set-option -ag status-right " #[fg=cyan][%Y-%m-%d(%a) %H:%M] #{weather} "

# put status on absolute centre. https://github.com/tmux/tmux/issues/2578
set -g status-justify absolute-centre
set -g status-position top
set -g status-interval 5
set -g window-status-format '#[fg=colour196]#I:#(echo "#{pane_current_path}" | sed -E "s|^$HOME|~|; s|^.+(.{20})$|…\1|")'
set -g window-status-current-format '#[fg=colour255,bg=colour124][#I:#(echo "#{pane_current_path}" | sed -E "s|^$HOME|~|; s|^.+(.{20})$|…\1|")]'

setw -g mode-keys vi
# prefix + v でスクロールバック全体をvimで開く(終了時に一時ファイルを削除)
bind v run-shell 'f=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX") && tmux capture-pane -p -J -S - -t "#{pane_id}" > "$f" && tmux new-window -n scrollback "vim + \"$f\"; rm -f \"$f\""'

bind-key    -T copy-mode-vi v     send-keys -X begin-selection
bind-key    -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key    -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# prefix + f でフローティングのシェルを開閉する(セッション popup を使い回す)
bind f if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s popup"'

# 同時に複数ペインを扱う
bind e setw synchronize-panes \; display "synchronize-panes #{?synchronize-panes,ON,OFF}"

# マウスでウィンドウ・ペインの切り替えやリサイズを可能にする
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

